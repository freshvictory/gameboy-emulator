<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>

  <body>
    <script type="module">
      const result = await WebAssembly.instantiateStreaming(
        fetch("public/gameboy.wasm"),
        {
          env: {
            print: (clock) => console.log(`M cycles: ${clock}`),
          },
        },
      );
      const { start, step } = result.instance.exports;
      start();
      step();
    </script>
  </body>
</html>
