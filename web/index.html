<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <style>
      html {
        color-scheme: light dark;

        /* --scale: round(
          down,
          min(calc(100svh / 526px - 0.25), calc(100svw / 320px - 0.25)),
          0.25
        ); */
        --scale: 2;
      }

      body {
        margin: 30px;

        display: flex;
        flex-wrap: wrap;
        gap: 30px;
      }

      canvas {
        image-rendering: pixelated;

        background-color: rgb(141 161 92);
      }

      .gameboy {
        inline-size: calc(var(--scale) * 320px);
        block-size: calc(var(--scale) * 526px);
        box-sizing: border-box;

        background-color: rgb(201 197 194);
        padding-inline: calc(var(--scale) * 25px);
        padding-block: calc(var(--scale) * 43px);
        border-radius: calc(var(--scale) * 11px);

        font-family: sans-serif;

        -webkit-user-select: none;
        user-select: none;
      }

      .panel {
        background-color: rgb(135 132 139);

        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: 1fr auto 1fr;

        padding: calc(var(--scale) * 11px);
        padding-block-end: calc(var(--scale) * 27px);
        border-radius: calc(var(--scale) * 11px);
        border-end-end-radius: calc(var(--scale) * 43px);

        border: calc(var(--scale) * 1px) solid rgb(185 182 182);
        box-shadow: calc(var(--scale) * 1px) calc(var(--scale) * 1px) 2px
          calc(var(--scale) * -1px) rgb(123 110 102);

        font-size: calc(var(--scale) * 7px);
        text-transform: uppercase;
        color: rgb(188 188 188);
      }

      .banner {
        grid-column: 1 / span 3;

        margin-block-end: calc(var(--scale) * 11px);

        padding-inline-start: calc(var(--scale) * 75px);

        background: linear-gradient(
          to bottom,
          rgb(145 70 111) 25%,
          transparent 25% 75%,
          rgb(68 56 117) 75%
        );

        span {
          padding-inline: calc(var(--scale) * 7px);
          display: inline-block;
          background-color: rgb(135 132 139);
        }
      }

      .battery {
        grid-row: 2;

        margin-top: calc(var(--scale) * 50px);

        letter-spacing: -1px;

        .indicator {
          appearance: none;

          box-sizing: border-box;

          inline-size: calc(var(--scale) * 11px);
          aspect-ratio: 1;
          border-radius: 100%;

          margin-inline: calc(var(--scale) * 5px);
          margin-block-end: calc(var(--scale) * 7px);

          background-color: hsl(0, 0%, 20%);
        }

        .indicator:checked {
          background-color: oklch(71.143% 0.16761 12.698);
          box-shadow:
            inset oklch(36.831% 0.16761 12.698) 0 calc(var(--scale) * 0.5px)
              calc(var(--scale) * 5px),
            oklch(62.793% 0.26761 12.698 / 0.5) 0 calc(var(--scale) * 1px)
              calc(var(--scale) * 6px);
        }
      }

      .gameboy canvas {
        grid-row: 2;

        display: block;
        box-sizing: content-box;
        margin-inline-end: auto;

        box-shadow: inset calc(var(--scale) * 2px) calc(var(--scale) * 2px)
          calc(var(--scale) * 4px) 3px rgb(106 112 64);

        inline-size: calc(var(--scale) * 160px);
        block-size: calc(var(--scale) * 144px);
        padding: calc(var(--scale) * 5px);
      }

      .logo {
        color: rgb(63 63 139);
        font-family: "Gill Sans", sans-serif;
        font-style: italic;
        text-transform: uppercase;

        font-weight: normal;
        margin-block: calc(var(--scale) * 5px);
      }

      output {
        font-family: monospace;
        font-variant-numeric: tabular-nums;

        h2 {
          font-size: 1.25rem;
          margin-block: 10px;
        }

        h3 {
          font-size: 1rem;
          margin: 0;
        }

        fieldset {
          border: none;
          padding-inline: 0;
          padding-block: 10px;

          legend {
            padding: 0;
          }
        }
      }

      .registers {
        display: grid;
        grid-template-rows: auto auto;
        grid-auto-flow: column;

        border: 1px solid rgb(135 132 139);
        border-radius: 5px;
        overflow: clip;

        dt,
        dd {
          padding-block: 8px;
          padding-inline: 12px;
          text-align: center;
        }

        dt {
          border-block-end: none;
          font-size: 0.75rem;
        }

        :where(dt, dd):not(:last-of-type) {
          border-inline-end: 1px solid rgb(135 132 139);
        }

        dd {
          margin: 0;
          min-inline-size: 3ch;
        }
      }

      .gpu-mode,
      .flags {
        display: flex;
        gap: 10px;
        justify-content: space-evenly;

        label {
          display: flex;

          padding: 5px;
        }

        label:has(:checked) {
          background-color: var(--c-toggled);
        }

        input {
          appearance: none;
          margin: 0;
        }
      }

      .flags {
        --c-toggled: powderblue;
      }

      .gpu-mode {
        --c-toggled: coral;
      }

      .gpu-meters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .dots,
      .scanline {
        display: flex;
        flex-direction: column;
        margin-block: 10px;
        gap: 5px;

        progress {
          inline-size: 100%;
        }
      }
    </style>
  </head>

  <body>
    <output id="output" for="form">
      <h2>CPU</h2>

      <h3>Opcode</h3>
      <p id="opcode">0x00</p>

      <h3>Registers</h3>
      <dl class="registers">
        <dt>A</dt>
        <dd id="register:a">0</dd>

        <dt>B</dt>
        <dd id="register:b">0</dd>

        <dt>C</dt>
        <dd id="register:c">0</dd>

        <dt>D</dt>
        <dd id="register:d">0</dd>

        <dt>E</dt>
        <dd id="register:e">0</dd>

        <dt>H</dt>
        <dd id="register:h">0</dd>

        <dt>L</dt>
        <dd id="register:l">0</dd>

        <dt><abbr title="Stack pointer">SP</abbr></dt>
        <dd id="register:stack-pointer">0</dd>

        <dt><abbr title="Program counter">PC</abbr></dt>
        <dd id="program-counter">0</dd>
      </dl>

      <fieldset class="flags">
        <legend><h3>Flags</h3></legend>

        <label>
          <input type="checkbox" name="flags" value="carried" />
          Carried
        </label>
        <label>
          <input type="checkbox" name="flags" value="half-carried" />
          Half-carried
        </label>
        <label>
          <input type="checkbox" name="flags" value="subtracted" />
          Subtracted
        </label>
        <label>
          <input type="checkbox" name="flags" value="was-zero" />
          Was zero
        </label>
      </fieldset>

      <h2>GPU</h2>
      <fieldset class="gpu-mode">
        <legend><h3>Mode</h3></legend>
        <label>
          <input type="radio" name="gpu-mode" value="finding-objects" />
          Finding objects
        </label>
        <label>
          <input type="radio" name="gpu-mode" value="drawing" readonly />
          Drawing
        </label>
        <label>
          <input
            type="radio"
            name="gpu-mode"
            value="horizontal-blank"
            readonly
          />
          Horizontal blank
        </label>
        <label>
          <input type="radio" name="gpu-mode" value="vertical-blank" readonly />
          Vertical blank
        </label>
      </fieldset>
      <div class="gpu-meters">
        <label class="dots">
          <progress id="dots" max="456" value="0"></progress>
          <span id="dots-text">Dots </span>
        </label>
        <label class="scanline">
          <progress id="scanline" max="154" value="0"></progress>
          <span id="scanline-text">Scanline </span>
        </label>
      </div>
      <h3>Background</h3>
      <canvas id="background-canvas" width="256" height="256"></canvas>
    </output>

    <div id="gameboy" class="gameboy">
      <div class="panel">
        <div class="banner"><span>Dot matrix with stereo sound</span></div>
        <div class="battery">
          <input type="checkbox" id="battery" class="indicator" />
          <label for="battery">Battery</label>
        </div>

        <canvas id="canvas" width="160" height="144"></canvas>
      </div>
      <h1 class="logo">Game Boy</h1>
      <form id="buttons">
        <button value="play">Play</button>
        <button value="pause">Pause</button>
        <button value="frame">Frame</button>
        <button value="scanline">Scanline</button>
        <button value="step">Step</button>
      </form>
    </div>

    <script>
      function debug(info, opcode) {
        debugCPU(info.cpu);
        debugGPU(info.gpu);
        let opcodeHex = opcode?.toString("16")?.toUpperCase() ?? "0";
        if (opcodeHex.length < 2) {
          opcodeHex = "0" + opcodeHex;
        }

        document.getElementById("opcode").textContent = "0x" + opcodeHex;
      }

      function debugCPU(cpu) {
        debugRegisters(cpu.registers);
        document.getElementById("program-counter").textContent =
          cpu.programCounter;

        document.querySelector("[value=carried]").checked = cpu.flags.carried;
        document.querySelector("[value=half-carried]").checked =
          cpu.flags.halfCarried;
        document.querySelector("[value=subtracted]").checked =
          cpu.flags.subtracted;
        document.querySelector("[value=was-zero]").checked = cpu.flags.wasZero;
      }

      function debugRegisters(registers) {
        document.getElementById("register:a").textContent = registers.a;
        document.getElementById("register:b").textContent = registers.b;
        document.getElementById("register:c").textContent = registers.c;
        document.getElementById("register:d").textContent = registers.d;
        document.getElementById("register:e").textContent = registers.e;
        document.getElementById("register:h").textContent = registers.h;
        document.getElementById("register:l").textContent = registers.l;
        document.getElementById("register:stack-pointer").textContent =
          registers.stackPointer;
      }

      function debugGPU(gpu) {
        document.querySelector(
          `input[name="gpu-mode"][value="${gpu.mode}"]`,
        ).checked = true;
        document.getElementById("dots").value = gpu.dots;
        document.getElementById("dots-text").textContent =
          `Dots ${gpu.dots}/456`;
        document.getElementById("scanline").value = gpu.scanline;
        document.getElementById("scanline-text").textContent =
          `Scanline ${gpu.scanline}/154`;
      }

      class Gameboy {
        /**
         * @param {WebAssembly.Exports} library
         * @param {HTMLCanvasElement | OffscreenCanvas} canvas
         * @param {HTMLCanvasElement | OffscreenCanvas | null} backgroundCanvas
         */
        constructor(library, canvas, backgroundCanvas = null) {
          this.context = canvas.getContext("2d");
          this.context.imageSmoothingEnabled = false;

          this.library = library;
          this.memory = library.memory;
          const debugPointer = library.getDebugStatePointer();
          this.debugView = new DataView(this.memory.buffer, debugPointer);

          const cartridgePointer = library.getCartridgeBufferPointer();
          this.cartridgeBuffer = new Uint8Array(
            this.memory.buffer,
            cartridgePointer,
            8 * 1024 * 1024,
          );

          const framePointer = library.getFramePointer();
          this.frameBuffer = new Uint8ClampedArray(
            this.memory.buffer,
            framePointer,
            160 * 144 * 4,
          );

          const backgroundPixelsPointer = library.getBackgroundPixelsPointer();
          this.backgroundPixels = new Uint8ClampedArray(
            this.memory.buffer,
            backgroundPixelsPointer,
            256 * 256 * 4,
          );
          this.backgroundContext = backgroundCanvas?.getContext("2d");

          this.animationId = -1;
        }

        /** @param {File | ArrayBuffer} file */
        async boot(file) {
          const data = file instanceof File ? await file.arrayBuffer() : file;
          const length = await this.#loadCartridge(data);
          this.context.clearRect(
            0,
            0,
            this.context.canvas.width,
            this.context.canvas.height,
          );
          this.library.start(length);
        }

        play() {
          cancelAnimationFrame(this.animationId);
          const frame = () => {
            this.frame();
            this.animationId = requestAnimationFrame(frame);
          };
          this.animationId = requestAnimationFrame(frame);
        }

        pause() {
          cancelAnimationFrame(this.animationId);
        }

        step() {
          const opcode = this.library.step();
          const debugInfo = this.debug();
          debug(debugInfo, opcode);
          this.debugBackground(debugInfo.gpu.background);
        }

        frame() {
          this.library.frame();
          this.drawFrame();
          const debugInfo = this.debug();
          debug(debugInfo, undefined);
          this.debugBackground(debugInfo.gpu.background);
        }

        scanline() {
          this.library.scanline();
          this.drawFrame();
          const debugInfo = this.debug();
          debug(debugInfo, undefined);
          this.debugBackground(debugInfo.gpu.background);
        }

        /**
         * @param {number} row
         */
        drawFrame(row) {
          const imageData = new ImageData(this.frameBuffer, 160);
          this.context.putImageData(imageData, 0, 0);
        }

        debugBackground(background) {
          if (!this.backgroundContext) return;

          this.backgroundContext.clearRect(0, 0, 255, 255);

          const imageData = new ImageData(this.backgroundPixels, 256);
          this.backgroundContext.putImageData(imageData, 0, 0);
          this.backgroundContext.strokeStyle = `rgb(255 0 0)`;
          this.backgroundContext.strokeRect(
            background.scrollX,
            background.scrollY,
            160,
            144,
          );
        }

        debug() {
          const stackPointer = this.debugView.getUint16(0, true);
          const programCounter = this.debugView.getUint16(2, true);
          const flags = this.debugView.getUint8(11);
          const enabledInterrupts = this.debugView.getUint8(17);
          const activeInterrupts = this.debugView.getUint8(18);
          const gpuMode = this.debugView.getUint8(19);
          return {
            cpu: {
              registers: {
                a: this.debugView.getUint8(4),
                b: this.debugView.getUint8(5),
                c: this.debugView.getUint8(6),
                d: this.debugView.getUint8(7),
                e: this.debugView.getUint8(8),
                h: this.debugView.getUint8(9),
                l: this.debugView.getUint8(10),
                stackPointer,
              },
              programCounter,
              flags: {
                carried: (flags & 0x10) !== 0,
                halfCarried: (flags & 0x20) !== 0,
                subtracted: (flags & 0x40) !== 0,
                wasZero: (flags & 0x80) !== 0,
              },
              halted: false, // this.debugView.getUint8(19) !== 0,
              interruptMasterEnable: false, // this.debugView.getUint8(20) !== 0,
            },
            interrupts: {
              active: {
                vBlank: (activeInterrupts & 0b1) !== 0,
                lcd: (activeInterrupts & 0b10) !== 0,
                timer: (activeInterrupts & 0b100) !== 0,
                serial: (activeInterrupts & 0b1000) !== 0,
                joypad: (activeInterrupts & 0b10000) !== 0,
              },
              enabled: {
                vBlank: (enabledInterrupts & 0b1) !== 0,
                lcd: (enabledInterrupts & 0b10) !== 0,
                timer: (enabledInterrupts & 0b100) !== 0,
                serial: (enabledInterrupts & 0b1000) !== 0,
                joypad: (enabledInterrupts & 0b10000) !== 0,
              },
            },
            gpu: {
              mode:
                gpuMode === 0
                  ? "horizontal-blank"
                  : gpuMode === 1
                    ? "vertical-blank"
                    : gpuMode === 2
                      ? "drawing"
                      : "finding-objects",
              scanline: this.debugView.getUint8(20),
              dots: this.debugView.getUint32(21),
              background: {
                scrollX: this.debugView.getUint8(25),
                scrollY: this.debugView.getUint8(26),
              },
            },
          };
        }

        /** @param {ArrayBuffer} data */
        async #loadCartridge(data) {
          this.cartridgeBuffer.set(new Uint8Array(data));

          return data.byteLength;
        }
      }
    </script>

    <script type="module">
      const buttons = document.getElementById("buttons");

      const output = document.getElementById("output");
      if (!output) throw new Error("Missing output element");

      /** @type {HTMLCanvasElement | null} */
      const canvas = document.getElementById("canvas");
      const backgroundCanvas = document.getElementById("background-canvas");

      const file = await fetch("../games/testGame.gb");
      const data = await file.arrayBuffer();

      const result = await WebAssembly.instantiateStreaming(
        fetch("public/gameboy.wasm"),
        {
          env: {
            drawScanline(row) {
              gameboy.drawScanline(row);
            },
          },
        },
      );

      const gameboy = new Gameboy(
        result.instance.exports,
        canvas,
        backgroundCanvas,
      );
      gameboy.boot(data);

      buttons.addEventListener("submit", function (event) {
        event.preventDefault();

        const action = event.submitter.value;

        switch (action) {
          case "play": {
            gameboy.play();
            return;
          }
          case "pause": {
            gameboy.pause();
            return;
          }
          case "frame": {
            gameboy.pause();
            gameboy.frame();
            return;
          }
          case "scanline": {
            gameboy.pause();
            gameboy.scanline();
            break;
          }
          case "step": {
            gameboy.pause();
            gameboy.step();
            return;
          }
        }
      });

      const gameboyElement = document.getElementById("gameboy");

      gameboyElement.addEventListener("drop", function (event) {
        event.preventDefault();
        const files = [...event.dataTransfer.items]
          .map((item) => item.getAsFile())
          .filter((file) => !!file);

        const file = files[0];
        gameboy.boot(file);
      });

      gameboyElement.addEventListener("dragover", function (event) {
        if (containsFile(event)) {
          event.preventDefault();
          event.dataTransfer.dropEffect = "copy";
        }
      });

      // Stop the default browser behavior of dropping a file opens it
      window.addEventListener("drop", function (event) {
        if (containsFile(event)) {
          event.preventDefault();
        }
      });

      window.addEventListener("dragover", function (event) {
        if (containsFile(event)) {
          event.preventDefault();
          if (!gameboyElement.contains(event.target)) {
            event.dataTransfer.dropEffect = "none";
          }
        }
      });

      function containsFile(event) {
        return [...event.dataTransfer.items].some(
          (item) => item.kind === "file",
        );
      }
    </script>
  </body>
</html>
