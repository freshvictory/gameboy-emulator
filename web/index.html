<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <style>
      html {
        color-scheme: light dark;

        /* --scale: round(
          down,
          min(calc(100svh / 526px - 0.25), calc(100svw / 320px - 0.25)),
          0.25
        ); */
        --scale: 2;
      }

      body {
        margin: 30px;
      }

      .gameboy {
        inline-size: calc(var(--scale) * 320px);
        block-size: calc(var(--scale) * 526px);
        box-sizing: border-box;

        background-color: rgb(201 197 194);
        padding-inline: calc(var(--scale) * 25px);
        padding-block: calc(var(--scale) * 43px);
        border-radius: calc(var(--scale) * 11px);

        font-family: sans-serif;

        -webkit-user-select: none;
        user-select: none;
      }

      .panel {
        background-color: rgb(135 132 139);

        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: 1fr auto 1fr;

        padding: calc(var(--scale) * 11px);
        padding-block-end: calc(var(--scale) * 27px);
        border-radius: calc(var(--scale) * 11px);
        border-end-end-radius: calc(var(--scale) * 43px);

        border: calc(var(--scale) * 1px) solid rgb(185 182 182);
        box-shadow: calc(var(--scale) * 1px) calc(var(--scale) * 1px) 2px
          calc(var(--scale) * -1px) rgb(123 110 102);

        font-size: calc(var(--scale) * 7px);
        text-transform: uppercase;
        color: rgb(188 188 188);
      }

      .banner {
        grid-column: 1 / span 3;

        margin-block-end: calc(var(--scale) * 11px);

        padding-inline-start: calc(var(--scale) * 75px);

        background: linear-gradient(
          to bottom,
          rgb(145 70 111) 25%,
          transparent 25% 75%,
          rgb(68 56 117) 75%
        );

        span {
          padding-inline: calc(var(--scale) * 7px);
          display: inline-block;
          background-color: rgb(135 132 139);
        }
      }

      .battery {
        grid-row: 2;

        margin-top: calc(var(--scale) * 50px);

        letter-spacing: -1px;

        .indicator {
          appearance: none;

          box-sizing: border-box;

          inline-size: calc(var(--scale) * 11px);
          aspect-ratio: 1;
          border-radius: 100%;

          margin-inline: calc(var(--scale) * 5px);
          margin-block-end: calc(var(--scale) * 7px);

          background-color: hsl(0, 0%, 20%);
        }

        .indicator:checked {
          background-color: oklch(71.143% 0.16761 12.698);
          box-shadow:
            inset oklch(36.831% 0.16761 12.698) 0 calc(var(--scale) * 0.5px)
              calc(var(--scale) * 5px),
            oklch(62.793% 0.26761 12.698 / 0.5) 0 calc(var(--scale) * 1px)
              calc(var(--scale) * 6px);
        }
      }

      canvas {
        grid-row: 2;

        display: block;
        box-sizing: content-box;
        margin-inline-end: auto;

        box-shadow: inset calc(var(--scale) * 2px) calc(var(--scale) * 2px)
          calc(var(--scale) * 4px) 3px rgb(106 112 64);

        inline-size: calc(var(--scale) * 160px);
        block-size: calc(var(--scale) * 144px);
        padding: calc(var(--scale) * 5px);

        image-rendering: pixelated;

        background-color: rgb(141 161 92);
      }

      output {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>

  <body>
    <div class="gameboy" role="presentation">
      <div class="panel">
        <div class="banner"><span>Dot matrix with stereo sound</span></div>
        <div class="battery">
          <input type="checkbox" id="battery" class="indicator" />
          <label for="battery">Battery</label>
        </div>

        <canvas id="canvas" width="160" height="144"></canvas>
      </div>
    </div>
    <h1>Gameboy Emulator</h1>

    <form id="form">
      <label for="cartridge">Select a cartridge:</label>
      <input
        id="cartridge"
        type="file"
        name="cartridge"
        required
        accept=".gb"
      />

      <button value="boot">Boot</button>
      <button value="play">Play</button>
      <button value="pause">Pause</button>
      <button value="frame">Frame</button>
      <button value="step">Step</button>
    </form>

    <output id="output" for="form">
      <h2>Opcode</h2>
      <p id="opcode"></p>

      <h2>CPU</h2>

      <dl>
        <dt>Halted</dt>
        <dd id="halted">false</dd>

        <dt>Interrupt master enable</dt>
        <dd id="interrupt-master-enable">false</dd>
      </dl>

      <h3>Registers</h3>
      <dl>
        <dt>A</dt>
        <dd id="register:a">0</dd>

        <dt>B</dt>
        <dd id="register:b">0</dd>

        <dt>C</dt>
        <dd id="register:c">0</dd>

        <dt>D</dt>
        <dd id="register:d">0</dd>

        <dt>E</dt>
        <dd id="register:e">0</dd>

        <dt>H</dt>
        <dd id="register:h">0</dd>

        <dt>L</dt>
        <dd id="register:l">0</dd>

        <dt>Stack pointer</dt>
        <dd id="register:stack-pointer">0</dd>

        <dt>Program counter</dt>
        <dd id="program-counter">0</dd>
      </dl>

      <h3>Flags</h3>
      <dl>
        <dt>Carried</dt>
        <dd id="carried">false</dd>

        <dt>Half carried</dt>
        <dd id="half-carried">false</dd>

        <dt>Subtracted</dt>
        <dd id="subtracted">false</dd>

        <dt>Was zero</dt>
        <dd id="was-zero">false</dd>
      </dl>

      <h2>GPU</h2>
      <p id="mode"></p>
    </output>

    <script>
      function debug(info, opcode) {
        debugCPU(info.cpu);
        debugGPU(info.gpu);
        document.getElementById("opcode").textContent =
          opcode?.toString(16) ?? "";
      }

      function debugCPU(cpu) {
        debugRegisters(cpu.registers);
        document.getElementById("program-counter").textContent =
          cpu.programCounter;

        document.getElementById("halted").textContent = cpu.halted;
        document.getElementById("interrupt-master-enable").textContent =
          cpu.interruptMasterEnable;

        document.getElementById("carried").textContent = cpu.flags.carried;
        document.getElementById("half-carried").textContent =
          cpu.flags.halfCarried;
        document.getElementById("subtracted").textContent =
          cpu.flags.subtracted;
        document.getElementById("was-zero").textContent = cpu.flags.wasZero;
      }

      function debugRegisters(registers) {
        document.getElementById("register:a").textContent = registers.a;
        document.getElementById("register:b").textContent = registers.b;
        document.getElementById("register:c").textContent = registers.c;
        document.getElementById("register:d").textContent = registers.d;
        document.getElementById("register:e").textContent = registers.e;
        document.getElementById("register:h").textContent = registers.h;
        document.getElementById("register:l").textContent = registers.l;
        document.getElementById("register:stack-pointer").textContent =
          registers.stackPointer;
      }

      function debugGPU(gpu) {
        document.getElementById("mode").textContent = gpu.mode;
      }

      class Gameboy {
        /**
         * @param {WebAssembly.Exports} library
         * @param {HTMLCanvasElement | OffscreenCanvas} canvas
         */
        constructor(library, canvas) {
          this.context = canvas.getContext("2d");
          this.context.imageSmoothingEnabled = false;

          this.library = library;
          this.memory = library.memory;
          const debugPointer = library.getDebugStatePointer();
          this.debugView = new DataView(this.memory.buffer, debugPointer);

          const cartridgePointer = library.getCartridgeBufferPointer();
          this.cartridgeBuffer = new Uint8Array(
            this.memory.buffer,
            cartridgePointer,
            8 * 1024 * 1024,
          );

          const framePointer = library.getFramePointer();
          this.frameBuffer = new Uint8ClampedArray(
            this.memory.buffer,
            framePointer,
            160 * 144 * 4,
          );

          this.animationId = -1;
        }

        /** @param {File?} file */
        async boot(file) {
          const length = await this.#loadCartridge(file);
          this.context.clearRect(
            0,
            0,
            this.context.canvas.width,
            this.context.canvas.height,
          );
          this.library.start(length);
        }

        play() {
          const frame = () => {
            this.frame();
            this.animationId = requestAnimationFrame(frame);
          };
          this.animationId = requestAnimationFrame(frame);
        }

        pause() {
          cancelAnimationFrame(this.animationId);
        }

        step() {
          const opcode = this.library.step();
          debug(this.debug(), opcode);
        }

        frame() {
          this.library.frame();
          this.drawFrame();
        }

        /**
         * @param {number} row
         */
        drawFrame(row) {
          const imageData = new ImageData(this.frameBuffer, 160);
          this.context.putImageData(imageData, 0, 0);
        }

        debug() {
          const stackPointer = this.debugView.getUint16(0, true);
          const programCounter = this.debugView.getUint16(2, true);
          const flags = this.debugView.getUint8(11);
          const enabledInterrupts = this.debugView.getUint8(17);
          const activeInterrupts = this.debugView.getUint8(18);
          const gpuMode = this.debugView.getUint8(21);
          return {
            cpu: {
              registers: {
                a: this.debugView.getUint8(4),
                b: this.debugView.getUint8(5),
                c: this.debugView.getUint8(6),
                d: this.debugView.getUint8(7),
                e: this.debugView.getUint8(8),
                h: this.debugView.getUint8(9),
                l: this.debugView.getUint8(10),
                stackPointer,
              },
              programCounter,
              flags: {
                carried: (flags & 0x10) !== 0,
                halfCarried: (flags & 0x20) !== 0,
                subtracted: (flags & 0x40) !== 0,
                wasZero: (flags & 0x80) !== 0,
              },
              halted: this.debugView.getUint8(19) !== 0,
              interruptMasterEnable: this.debugView.getUint8(20) !== 0,
            },
            interrupts: {
              active: {
                vBlank: (activeInterrupts & 0b1) !== 0,
                lcd: (activeInterrupts & 0b10) !== 0,
                timer: (activeInterrupts & 0b100) !== 0,
                serial: (activeInterrupts & 0b1000) !== 0,
                joypad: (activeInterrupts & 0b10000) !== 0,
              },
              enabled: {
                vBlank: (enabledInterrupts & 0b1) !== 0,
                lcd: (enabledInterrupts & 0b10) !== 0,
                timer: (enabledInterrupts & 0b100) !== 0,
                serial: (enabledInterrupts & 0b1000) !== 0,
                joypad: (enabledInterrupts & 0b10000) !== 0,
              },
            },
            gpu: {
              mode:
                gpuMode === 0
                  ? "horizontal blank"
                  : gpuMode === 1
                    ? "vertical blank"
                    : gpuMode === 2
                      ? "drawing"
                      : "finding objects",
            },
          };
        }

        /** @param {File} file */
        async #loadCartridge(file) {
          const data = await file.arrayBuffer();
          this.cartridgeBuffer.set(new Uint8Array(data));

          return data.byteLength;
        }
      }
    </script>

    <script type="module">
      const form = document.getElementById("form");
      if (!form) throw new Error("Missing form");

      const output = document.getElementById("output");
      if (!output) throw new Error("Missing output element");

      /** @type {HTMLCanvasElement | null} */
      const canvas = document.getElementById("canvas");

      const result = await WebAssembly.instantiateStreaming(
        fetch("public/gameboy.wasm"),
        {
          env: {
            drawScanline(row) {
              gameboy.drawScanline(row);
            },
          },
        },
      );

      const gameboy = new Gameboy(result.instance.exports, canvas);

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const action = event.submitter.value;

        switch (action) {
          case "boot": {
            const formData = new FormData(event.currentTarget);

            const file = formData.get("cartridge");
            if (file && !(file instanceof File)) {
              throw new Error("File invalid or not provided");
            }

            gameboy.pause();
            await gameboy.boot(file);

            debug(gameboy.debug());
            return;
          }
          case "play": {
            gameboy.play();
            return;
          }
          case "pause": {
            gameboy.pause();
            return;
          }
          case "frame": {
            gameboy.pause();
            gameboy.frame();
            return;
          }
          case "step": {
            gameboy.pause();
            gameboy.step();
            return;
          }
        }
      });
    </script>
  </body>
</html>
