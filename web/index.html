<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <style>
      html {
        color-scheme: light dark;
      }

      canvas {
        display: block;

        inline-size: 320px;
        block-size: 288px;
        image-rendering: pixelated;

        background-color: black;
        border: 1px solid currentColor;
      }

      output {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>

  <body>
    <h1>Gameboy Emulator</h1>

    <form id="form">
      <label for="cartridge">Select a cartridge:</label>
      <input
        id="cartridge"
        type="file"
        name="cartridge"
        required
        accept=".gb"
      />

      <button value="boot">Boot</button>
      <button value="play">Play</button>
      <button value="pause">Pause</button>
      <button value="step">Step</button>
    </form>

    <canvas id="canvas" width="160" height="144"></canvas>

    <output id="output" for="form">
      <h2>Opcode</h2>
      <p id="opcode"></p>

      <h2>CPU</h2>

      <dl>
        <dt>Halted</dt>
        <dd id="halted">false</dd>

        <dt>Interrupt master enable</dt>
        <dd id="interrupt-master-enable">false</dd>
      </dl>

      <h3>Registers</h3>
      <dl>
        <dt>A</dt>
        <dd id="register:a">0</dd>

        <dt>B</dt>
        <dd id="register:b">0</dd>

        <dt>C</dt>
        <dd id="register:c">0</dd>

        <dt>D</dt>
        <dd id="register:d">0</dd>

        <dt>E</dt>
        <dd id="register:e">0</dd>

        <dt>H</dt>
        <dd id="register:h">0</dd>

        <dt>L</dt>
        <dd id="register:l">0</dd>

        <dt>Stack pointer</dt>
        <dd id="register:stack-pointer">0</dd>

        <dt>Program counter</dt>
        <dd id="program-counter">0</dd>
      </dl>

      <h3>Flags</h3>
      <dl>
        <dt>Carried</dt>
        <dd id="carried">false</dd>

        <dt>Half carried</dt>
        <dd id="half-carried">false</dd>

        <dt>Subtracted</dt>
        <dd id="subtracted">false</dd>

        <dt>Was zero</dt>
        <dd id="was-zero">false</dd>
      </dl>
    </output>

    <script>
      function debug(info, opcode) {
        debugCPU(info.cpu);
        document.getElementById("opcode").textContent =
          opcode?.toString(16) ?? "";
      }

      function debugCPU(cpu) {
        debugRegisters(cpu.registers);
        document.getElementById("program-counter").textContent =
          cpu.programCounter;

        document.getElementById("halted").textContent = cpu.halted;
        document.getElementById("interrupt-master-enable").textContent =
          cpu.interruptMasterEnable;

        document.getElementById("carried").textContent = cpu.flags.carried;
        document.getElementById("half-carried").textContent =
          cpu.flags.halfCarried;
        document.getElementById("subtracted").textContent =
          cpu.flags.subtracted;
        document.getElementById("was-zero").textContent = cpu.flags.wasZero;
      }

      function debugRegisters(registers) {
        document.getElementById("register:a").textContent = registers.a;
        document.getElementById("register:b").textContent = registers.b;
        document.getElementById("register:c").textContent = registers.c;
        document.getElementById("register:d").textContent = registers.d;
        document.getElementById("register:e").textContent = registers.e;
        document.getElementById("register:h").textContent = registers.h;
        document.getElementById("register:l").textContent = registers.l;
        document.getElementById("register:stack-pointer").textContent =
          registers.stackPointer;
      }

      class Gameboy {
        /**
         * @param {WebAssembly.Exports} library
         * @param {HTMLCanvasElement | OffscreenCanvas} canvas
         */
        constructor(library, canvas) {
          this.context = canvas.getContext("2d", { alpha: false });
          this.context.imageSmoothingEnabled = false;

          this.library = library;
          this.memory = library.memory;
          const debugPointer = library.getDebugStatePointer();
          this.debugView = new DataView(this.memory.buffer, debugPointer);
          this.animationId = -1;
        }

        /** @param {File?} file */
        async boot(file) {
          const length = await this.#loadCartridge(file);
          this.library.start(length);
        }

        play() {
          const step = () => {
            this.step();
            this.animationId = requestAnimationFrame(step);
          };
          this.animationId = requestAnimationFrame(step);
        }

        pause() {
          cancelAnimationFrame(this.animationId);
        }

        step() {
          const opcode = this.library.step();
          debug(this.debug(), opcode);
        }

        debug() {
          const stackPointer = this.debugView.getUint16(0, true);
          const programCounter = this.debugView.getUint16(2, true);
          const flags = this.debugView.getUint8(11);
          const enabledInterrupts = this.debugView.getUint8(17);
          const activeInterrupts = this.debugView.getUint8(18);
          return {
            cpu: {
              registers: {
                a: this.debugView.getUint8(4),
                b: this.debugView.getUint8(5),
                c: this.debugView.getUint8(6),
                d: this.debugView.getUint8(7),
                e: this.debugView.getUint8(8),
                h: this.debugView.getUint8(9),
                l: this.debugView.getUint8(10),
                stackPointer,
              },
              programCounter,
              flags: {
                carried: (flags & 0x10) !== 0,
                halfCarried: (flags & 0x20) !== 0,
                subtracted: (flags & 0x40) !== 0,
                wasZero: (flags & 0x80) !== 0,
              },
              halted: this.debugView.getUint8(19) !== 0,
              interruptMasterEnable: this.debugView.getUint8(20) !== 0,
            },
            interrupts: {
              active: {
                vBlank: (activeInterrupts & 0b1) !== 0,
                lcd: (activeInterrupts & 0b10) !== 0,
                timer: (activeInterrupts & 0b100) !== 0,
                serial: (activeInterrupts & 0b1000) !== 0,
                joypad: (activeInterrupts & 0b10000) !== 0,
              },
              enabled: {
                vBlank: (enabledInterrupts & 0b1) !== 0,
                lcd: (enabledInterrupts & 0b10) !== 0,
                timer: (enabledInterrupts & 0b100) !== 0,
                serial: (enabledInterrupts & 0b1000) !== 0,
                joypad: (enabledInterrupts & 0b10000) !== 0,
              },
            },
          };
        }

        /** @param {File} file */
        async #loadCartridge(file) {
          const pointer = this.library.getCartridgeBufferPointer();
          const data = await file.arrayBuffer();
          const array = new Uint8Array(
            this.memory.buffer,
            pointer,
            data.byteLength,
          );
          array.set(new Uint8Array(data));

          return data.byteLength;
        }
      }
    </script>

    <script type="module">
      const form = document.getElementById("form");
      if (!form) throw new Error("Missing form");

      const output = document.getElementById("output");
      if (!output) throw new Error("Missing output element");

      /** @type {HTMLCanvasElement | null} */
      const canvas = document.getElementById("canvas");

      const result = await WebAssembly.instantiateStreaming(
        fetch("public/gameboy.wasm"),
      );

      const gameboy = new Gameboy(result.instance.exports, canvas);

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const action = event.submitter.value;

        switch (action) {
          case "boot": {
            const formData = new FormData(event.currentTarget);

            const file = formData.get("cartridge");
            if (file && !(file instanceof File)) {
              throw new Error("File invalid or not provided");
            }

            await gameboy.boot(file);

            debug(gameboy.debug());
            return;
          }
          case "play": {
            gameboy.play();
            return;
          }
          case "pause": {
            gameboy.pause();
            return;
          }
          case "step": {
            gameboy.step();
            return;
          }
        }
      });
    </script>
  </body>
</html>
